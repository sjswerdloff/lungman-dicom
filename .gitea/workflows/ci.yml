name: CI

on:
  # Not filtered by base branch, so a stacked pull request still gets a run.
  pull_request:
  # The merge result on main, which a green pull-request head does not show.
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: macos-latest
    timeout-minutes: 40 # the runner hosts also run long computations; 20 minutes timed out on a busy host
    steps:
      # Pinned to the commit sha: a tag is mutable.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # the merge below cannot run in a shallow clone

      # Test the merge result, not only the branch. A conflict fails the run.
      - name: Merge the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          echo "merging origin/${{ github.base_ref }} at $(git rev-parse --short FETCH_HEAD) into ${{ github.sha }}"
          git merge --no-commit --no-ff FETCH_HEAD

      - name: Install uv
        run: |
          command -v uv > /dev/null 2>&1 || export PATH="/opt/homebrew/bin:$PATH"
          command -v uv > /dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
          uv --version

      # --frozen: the lock file is what gets tested. The autoseg group (TotalSegmentator, torch) is not installed.
      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Ruff check
        run: uv run --frozen ruff check lungman_dicom tests validation

      - name: Ruff format check
        run: uv run --frozen ruff format --check lungman_dicom tests validation

      - name: Mypy
        run: uv run --frozen mypy

      # The real-data tests need the Lungman archive. A copy on the runner host's own disk is tried first: the MacBook
      # Pro has one in ai/ci_fixtures, and on the Mac Studio ai/AIDocumentCommons is the shared directory itself.
      # The paths are absolute because the Mac Studio's runner is a different user, with a different home directory.
      # On other hosts ai/AIDocumentCommons, like /Volumes/AIDocumentCommons, is the network mount. A runner that macOS has not
      # allowed to use network volumes blocks when it opens a file there, so each try reads a few bytes with a
      # 20-second limit. If no copy is readable the run fails here, so a
      # green run always means the real-data tests ran. -rs prints any other skip with its reason.
      - name: Locate the Lungman data
        run: |
          for D in /Users/stuartswerdloff/ai/ci_fixtures/lungman_data \
                   /Users/stuartswerdloff/ai/AIDocumentCommons/KindledRT/Lungman/lungman_data \
                   /Volumes/AIDocumentCommons/KindledRT/Lungman/lungman_data; do
            if perl -e 'alarm 20; exec @ARGV' head -c 16 "$D/SEGMENTATION/labels.dat" > /dev/null 2>&1 \
               && perl -e 'alarm 20; exec @ARGV' ls "$D/CD1" > /dev/null 2>&1; then
              echo "LUNGMAN_DATA=$D" >> "$GITHUB_ENV"
              echo "real-data tests will run against $D"
              exit 0
            fi
            echo "not readable within 20 seconds: $D"
          done
          echo "::error::no readable copy of the Lungman data on $(hostname)"
          exit 1

      - name: Pytest
        run: uv run --frozen pytest --tb=short -rs
