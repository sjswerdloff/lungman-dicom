[project]
name = "lungman-autoseg"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy-stl>=4.0.1",
    "pydicom>=3.0.2",
    "rt-utils>=1.2.7",
    "scikit-image>=0.26.0",
    "simpleitk>=2.5.6",
    "tifffile>=2026.9.20",
    "totalsegmentator>=2.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
