name: CI

on:
  # Not filtered by base branch, so a stacked pull request still gets a run.
  pull_request:
  # The merge result on main, which a green pull-request head does not show.
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: macos-latest
    timeout-minutes: 40 # the runner hosts also run long computations; 20 minutes timed out on a busy host
    steps:
      # Pinned to the commit sha: a tag is mutable.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # the merge below cannot run in a shallow clone

      # Test the merge result, not only the branch. A conflict fails the run.
      - name: Merge the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          echo "merging origin/${{ github.base_ref }} at $(git rev-parse --short FETCH_HEAD) into ${{ github.sha }}"
          git merge --no-commit --no-ff FETCH_HEAD

      - name: Install uv
        run: |
          command -v uv > /dev/null 2>&1 || export PATH="/opt/homebrew/bin:$PATH"
          command -v uv > /dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
          uv --version

      # --frozen: the lock file is what gets tested. The autoseg group (TotalSegmentator, torch) is not installed.
      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Ruff check
        run: uv run --frozen ruff check lungman_dicom tests validation

      - name: Ruff format check
        run: uv run --frozen ruff format --check lungman_dicom tests validation

      - name: Mypy
        run: uv run --frozen mypy

      # The real-data tests read the Lungman archive from the shared volume, which every runner host mounts.
      # The mount is not guaranteed. When it is readable, LUNGMAN_DATA is set and a missing file stops the run.
      # When it is not, the step says so and the real-data tests skip; -rs prints each skip with its reason.
      - name: Locate the Lungman data
        run: |
          D=/Volumes/AIDocumentCommons/KindledRT/Lungman/lungman_data
          if [ -f "$D/SEGMENTATION/labels.dat" ]; then
            echo "LUNGMAN_DATA=$D" >> "$GITHUB_ENV"
            echo "real-data tests will run against $D"
          else
            echo "::warning::Lungman data not readable at $D on $(hostname): the real-data tests will SKIP"
          fi

      - name: Pytest
        run: uv run --frozen pytest --tb=short -rs
